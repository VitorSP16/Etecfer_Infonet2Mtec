<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <title>Formulário de Aluno</title>
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark shadow">
        <div class="container">
            <span class="navbar-brand fs-3 fw-bold">
                Sistema EtecFer
            </span>
        </div>
    </nav>

    <div class="container mt-5">

        <div class="mb-4">
            <h2>Cadastrar Aluno</h2>
        </div>

        <div class="card shadow">
            <div class="card-body p-4">

                <form th:action="@{/alunos/salvar}" method="post" th:object="${aluno}">
                    
                    <input type="hidden" th:field="*{idAluno}"/>

                    <div class="mb-3">
                        <label for="nomeAluno" class="form-label font-weight-bold">Nome:</label>
                        <input type="text" id="nomeAluno" class="form-control" th:field="*{nomeAluno}" placeholder="Digite o nome completo" required />
                    </div>

                    <div class="mb-3">
                        <label for="emailAluno" class="form-label">E-mail:</label>
                        <input type="email" id="emailAluno" class="form-control" th:field="*{emailAluno}" placeholder="exemplo@email.com" required />
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="telefoneAluno" class="form-label">Telefone:</label>
                            <input type="text" id="telefoneAluno" class="form-control" th:field="*{telefoneAluno}" placeholder="(00) 00000-0000" />
                        </div>

                        <div class="col-md-6 mb-3">
                            <label for="raAluno" class="form-label">RA:</label>
                            <input type="text" id="raAluno" class="form-control" th:field="*{raAluno}" placeholder="Número do RA" />
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="cpfAluno" class="form-label">CPF:</label>
                        <input type="text" id="cpfAluno" class="form-control" th:field="*{cpfAluno}" placeholder="000.000.000-00" />
                    </div>
                     
                     <div class="mb-4"> 
                        <label for="idCurso">Curso:</label>
                        <select  th:field="*{curso}"name="" id="">
                            <option value="" disabled selected>Selecione um curso</option>
                            <option  th:each="curso :${cursos}" th:text="${curso.nomeCurso}" th:value="${curso.idCurso}"value=""></option>
                        </select>
                     </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-success">
                            Salvar
                        </button>
                        <a th:href="@{/alunos/listar}" class="btn btn-secondary">
                            Cancelar
                        </a>
                    </div>

                </form>

            </div>
        </div>

        <div class="mt-4">
            <a th:href="@{/alunos/listar}" class="btn btn-outline-secondary">
                ← Voltar para a Lista
            </a>
        </div>

    </div>

</body>
</html>
