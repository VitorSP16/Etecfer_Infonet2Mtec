<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de professor</title>
</head>
<body>
    <h1 style="text-align: center;"> Cadastrar professor</h1>

    <form th:action="@{/professores/salvar}" method="post" th:object="${professor}">
      
      <input type="hidden" th:field="*{idProfessor}"/>
      <label for="">Nome:</label>
      <input type="text" th:field="*{nomeProfessor}"/>
      <br/>

      <label for="">Telefone:</label>
      <input type="text" th:field="*{telProfessor}"/>
      <br/>

      <label for="">CPF:</label>
      <input type="text" th:field="*{cpfProfessor}"/>
      <br/>
      <label for="">Graduação:</label>
      <input type="text" th:field="*{graduacaoProfessor}"/>
      <br/>

     <input type="submit" value="salvar"/>
    </form>
</body>
</html>
