<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <title>Formulário de Professor</title>
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark shadow">
        <div class="container">
            <span class="navbar-brand fs-3 fw-bold">
                Sistema EtecFer
            </span>
        </div>
    </nav>

    <div class="container mt-5">

        <div class="mb-4">
            <h2>Cadastrar Professor</h2>
        </div>

        <div class="card shadow">
            <div class="card-body p-4">

                <form th:action="@{/professores/salvar}" method="post" th:object="${professor}">
                    
                    <input type="hidden" th:field="*{idProfessor}"/>

                    <div class="mb-3">
                        <label for="nomeProfessor" class="form-label">Nome Completo:</label>
                        <input type="text" id="nomeProfessor" class="form-control" th:field="*{nomeProfessor}" placeholder="Digite o nome completo do professor" required />
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="telProfessor" class="form-label">Telefone:</label>
                            <input type="text" id="telProfessor" class="form-control" th:field="*{telProfessor}" placeholder="(00) 00000-0000" />
                        </div>

                        <div class="col-md-6 mb-3">
                            <label for="cpfProfessor" class="form-label">CPF:</label>
                            <input type="text" id="cpfProfessor" class="form-control" th:field="*{cpfProfessor}" placeholder="000.000.000-00" />
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="graduacaoProfessor" class="form-label">Graduação:</label>
                        <input type="text" id="graduacaoProfessor" class="form-control" th:field="*{graduacaoProfessor}" placeholder="Ex: Ciência da Computação / Pedagogia" />
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-success">
                            Salvar
                        </button>
                        <a href="/professores" class="btn btn-secondary">
                            Cancelar
                        </a>
                    </div>

                </form>

            </div>
        </div>

        <div class="mt-4">
            <a th:href="@{/professores/listar}" class="btn btn-outline-secondary">
                ← Voltar para a Lista
            </a>
        </div>

    </div>

</body>
</html>
