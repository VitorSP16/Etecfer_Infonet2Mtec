<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <title>Lista de Disciplinas</title>
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark shadow">
        <div class="container">
            <span class="navbar-brand fs-3 fw-bold">
                Sistema EtecFer
            </span>
        </div>
    </nav>

    <div class="container mt-5">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Lista de Disciplinas</h2>

            <a href="/disciplinas/criar" class="btn btn-success">
                + Nova Disciplina
            </a>
        </div>

        <div class="card shadow">

            <div class="card-body">

                <table class="table table-striped table-hover align-middle">

                    <thead class="table-dark">
                        <tr>
                            <th>Nome</th>
                            <th>Sigla</th>
                            <th>Carga Horária</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody>

                        <tr th:each="disciplina : ${disciplinas}">
                            <td th:text="${disciplina.nomeDisciplina}"></td>
                            <td th:text="${disciplina.siglaDisciplina}"></td>
                            <td th:text="${disciplina.cargahDisciplina}"></td>

                            <td>

                                <a class="btn btn-warning btn-sm"
                                   th:href="@{/disciplinas/editar/{id}(id=${disciplina.idDisciplina})}">
                                    Editar
                                </a>

                                <a class="btn btn-danger btn-sm"
                                   th:href="@{/disciplinas/excluir/{id}(id=${disciplina.idDisciplina})}">
                                    Excluir
                                </a>

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

        <div class="mt-4">
            <a href="/" class="btn btn-secondary">
                ← Voltar ao Menu
            </a>
        </div>

    </div>

</body>
</html>
