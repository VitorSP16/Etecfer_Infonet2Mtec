<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <title>Formulário de Disciplina</title>
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark shadow">
        <div class="container">
            <span class="navbar-brand fs-3 fw-bold">
                Sistema EtecFer
            </span>
        </div>
    </nav>

    <div class="container mt-5">

        <div class="mb-4">
            <h2>Cadastrar Disciplina</h2>
        </div>

        <div class="card shadow">
            <div class="card-body p-4">

                <form th:action="@{/disciplinas/salvar}" method="post" th:object="${disciplina}">
                    
                    <input type="hidden" th:field="*{idDisciplina}"/>

                    <div class="mb-3">
                        <label for="nomeDisciplina" class="form-label">Nome da Disciplina:</label>
                        <input type="text" id="nomeDisciplina" class="form-control" th:field="*{nomeDisciplina}" placeholder="Ex: Programação Web" required />
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="siglaDisciplina" class="form-label">Sigla:</label>
                            <input type="text" id="siglaDisciplina" class="form-control" th:field="*{siglaDisciplina}" placeholder="Ex: PW" />
                        </div>

                        <div class="col-md-6 mb-4">
                            <label for="cargahDisciplina" class="form-label">Carga Horária:</label>
                            <input type="text" id="cargahDisciplina" class="form-control" th:field="*{cargahDisciplina}" placeholder="Ex: 80h" />
                        </div>
                        
                        <div class="col-md-6 mb-4">
                            <label for="idCurso" class="form-label">Curso:</label>
                        
                            <select th:field="*{curso}" id="idCurso" class="form-select">
                                <option value="" disabled>Selecione um curso</option>
                        
                                <option th:each="curso : ${cursos}"
                                        th:text="${curso.nomeCurso}"
                                        th:value="${curso.idCurso}">
                                </option>
                            </select>
                        </div>
                        
                        <div class="col-md-6 mb-4">
                            <label for="idProfessor" class="form-label">Professor:</label>
                        
                            <select th:field="*{professor}" id="idProfessor" class="form-select">
                                <option value="" disabled>Selecione um professor</option>
                        
                                <option th:each="professor : ${professores}"
                                        th:text="${professor.nomeProfessor}"
                                        th:value="${professor.idProfessor}">
                                </option>
                            </select>
                        </div>
                        
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-success">
                            Salvar
                        </button>
                        <a href="/disciplinas" class="btn btn-secondary">
                            Cancelar
                        </a>
                    </div>

                </form>

            </div>
        </div>

        <div class="mt-4">
            <a th:href="@{/disciplinas/listar}" class="btn btn-outline-secondary">
                ← Voltar para a Lista
            </a>
        </div>

    </div>

</body>
</html>
